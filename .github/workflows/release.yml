name: Release AAB (signed)

# E3 — release engineering. Builds a MINIFIED, SIGNED Android App Bundle (.aab) for
# a Play upload. Run manually from the Actions tab (or on a v* tag). Kept separate
# from build.yml because it needs the upload keystore secrets and should not run on
# every push.
#
# Signing is Play App Signing: we sign the bundle with the UPLOAD key here; Google
# re-signs it with the real app-signing key it holds. Losing this upload key is
# recoverable (you can request a reset); the app-signing key never leaves Google.
#
# ── One-time setup by the repo owner (build stays unsigned until all four exist) ──
#   1. Generate an upload keystore (keep the .jks safe, OFF the repo):
#        keytool -genkeypair -v -keystore upload-keystore.jks -alias upload \
#          -keyalg RSA -keysize 2048 -validity 10000
#   2. base64-encode it:  base64 -w0 upload-keystore.jks   (macOS: base64 -i …)
#   3. Add repository SECRETS (Settings → Secrets and variables → Actions → Secrets):
#        RELEASE_KEYSTORE_BASE64  = the base64 string from step 2
#        RELEASE_STORE_PASSWORD   = the keystore password
#        RELEASE_KEY_ALIAS        = upload   (the -alias you chose)
#        RELEASE_KEY_PASSWORD     = the key password (often the same as the store)
#   4. Register the upload key's SHA-1 in Firebase (so Google sign-in works on the
#        release build) and enroll the app in Play App Signing when you create it in
#        the Play Console. Get the SHA-1 with:
#        keytool -list -v -keystore upload-keystore.jks -alias upload

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Marketing version name (e.g. 1.0)"
        required: true
        default: "1.0"
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Gate on the same unit tests as the debug build — a regression means no AAB.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Decode the base64 keystore secret to a file the Gradle signing config reads.
      # If the secret is unset the file is empty, hasReleaseSigning stays false, and
      # the build below produces an UNSIGNED bundle (surfaced in the summary).
      - name: Decode upload keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set — building an UNSIGNED bundle."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release AAB
        env:
          # versionCode must strictly increase per Play upload; the workflow run
          # number is monotonic for this workflow, so it satisfies that.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0' }}
          # Upload-key signing (read by app/build.gradle.kts). Absent ⇒ unsigned.
          RELEASE_STORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/upload-keystore.jks', runner.temp) || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # App config, same as the debug/other builds.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew bundleRelease

      # Keep the R8 mapping file — it deobfuscates release crash stack traces and
      # should be uploaded to the Play Console alongside the bundle.
      - name: Upload R8 mapping file
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
