name: Build JARVIS Debug APK

# Builds on every push and can also be run manually from the Actions tab.
# (Public repo: GitHub Actions minutes are free, so per-push builds are fine.)
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Gates the build: if the parsers or the session state machine regress, no
      # APK is produced. "Artifact present" therefore now means compiles AND the
      # logic is still correct — not just compiles.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Static analysis. Report-only (lint.abortOnError = false), so it surfaces
      # manifest/permission/resource/API issues without blocking the build yet.
      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Build debug APK
        env:
          # Injected from repository secrets; empty if a secret is unset.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Fast check (~1 min): runs the openWakeWord streaming pipeline on a real "hey
  # jarvis" recording and asserts it detects the phrase and ignores silence. Verifies
  # the pipeline math + threshold without a device (the emulator job covers the load).
  wakeword-pipeline:
    name: Wake-word pipeline check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet ai-edge-litert numpy
      - name: Run openWakeWord pipeline check
        run: python scripts/owwtest/run.py

  # Runs the instrumented tests on a real Android runtime (emulator). Kept as a
  # SEPARATE job so the fast unit-test + APK job above is never blocked or slowed by
  # emulator boot/flakiness. Its headline test loads the openWakeWord TFLite models
  # on-device — the only automated place the CONV_2D load crash can be caught.
  instrumented:
    name: Emulator instrumented tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The emulator needs hardware acceleration to boot in reasonable time.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The GitHub emulator VM intermittently dies mid-run ("device offline"),
      # reliably during the heavy full-shell Compose render (JarvisAppUiTest). It's
      # a qemu/swiftshader crash, not a test failure, so a fresh emulator usually
      # passes. Retry up to twice (each attempt boots its own emulator) so one VM
      # crash doesn't red the whole pyramid.
      - name: Run instrumented tests on an emulator (attempt 1)
        id: emu1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          # The E2E tap probe is deliberately EXCLUDED here and runs in its own
          # job below. This suite has a demonstrated capacity ceiling — it
          # reliably crashed the VM at ten tests — so its proven-green set must
          # not grow just because a new instrumented test was added.
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.jarvis.os.e2e.A11yProbeTest

      - name: Run instrumented tests on an emulator (attempt 2)
        id: emu2
        if: steps.emu1.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          # The E2E tap probe is deliberately EXCLUDED here and runs in its own
          # job below. This suite has a demonstrated capacity ceiling — it
          # reliably crashed the VM at ten tests — so its proven-green set must
          # not grow just because a new instrumented test was added.
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.jarvis.os.e2e.A11yProbeTest

      - name: Run instrumented tests on an emulator (attempt 3)
        if: steps.emu1.outcome == 'failure' && steps.emu2.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          # The E2E tap probe is deliberately EXCLUDED here and runs in its own
          # job below. This suite has a demonstrated capacity ceiling — it
          # reliably crashed the VM at ten tests — so its proven-green set must
          # not grow just because a new instrumented test was added.
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.jarvis.os.e2e.A11yProbeTest

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  # The missing tier: a test that actually drives a TAP.
  #
  # Every other layer of the pyramid verifies logic given a screen; none of them
  # verify that a tap lands on a real one. That gap is why the 2026-08-14 device
  # trace could contain integration bugs no pure test could catch (planning
  # against an unrendered screen, a failed launch nobody read, a first-move Back
  # ending an errand).
  #
  # This is a PROBE, not yet a suite: one test settling whether the accessibility
  # service can be enabled from a test at all, and whether an androidTest-APK
  # Activity presents a package the executor is willing to act on.
  #
  # NON-GATING on purpose (continue-on-error). The team already found
  # a11y-in-emulator flaky, and the emulator tier has a hard capacity ceiling, so
  # until this is proven stable it must never red the proven-green pyramid.
  e2e-tap:
    name: E2E tap probe (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the E2E tap probe on an emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.jarvis.os.e2e.A11yProbeTest

      - name: Upload E2E probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tap-probe-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
