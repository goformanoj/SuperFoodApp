name: Backend eval (on-demand)

# Fires the marker-shape eval (scripts/eval/) at the LIVE Worker and prints a
# score. Manual ONLY (workflow_dispatch): it spends real Groq tokens and the
# model is non-deterministic, so it must never run per-push. Non-gating — it
# reports the score and does not fail the run (GATE is left unset), matching
# BACKEND_PLAN.md Phase 2 ("a non-gating CI job at first").
#
# To run it: add PROXY_SECRET as a repository secret and WORKER_URL as a
# repository variable, then trigger this workflow from the Actions tab. The
# Worker supplies the system prompt itself (its server-side default), so no
# system prompt is sent from here.
#
# Phase 3: once the Worker requires a Firebase ID token, add FIREBASE_WEB_API_KEY
# as a repository VARIABLE (it is the project's public web api key, not a secret).
# The eval then signs in anonymously and sends a real token. Without it, the eval
# falls back to the X-Uid stub, which the Worker rejects once verification is on.
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the eval against the live Worker
        env:
          # The Worker URL is public, so a hardcoded default keeps the eval
          # runnable with only PROXY_SECRET configured; a WORKER_URL repo
          # variable still overrides it if one is ever set.
          WORKER_URL: ${{ vars.WORKER_URL || 'https://superfoodapp.goformanoj.workers.dev' }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          # Public web api key: when set, the eval authenticates with a real
          # anonymous Firebase ID token (Phase 3). Each sign-in is a fresh
          # anonymous uid, so it also draws a fresh daily allowance per run.
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          # Fallback only (pre-Phase-3 / no web api key): a per-run uid draws a
          # fresh free daily allowance so the 60k/day cap never blocks the eval.
          EVAL_UID: eval-${{ github.run_id }}
        run: node scripts/eval/run.mjs
