# Config only — NEVER a key. The Groq key is set with:
#   wrangler secret put GROQ_API_KEY
name = "superfoodapp"
main = "src/index.js"
compatibility_date = "2026-08-18"

# Created in the dashboard (Storage & databases -> D1). The id is not a secret —
# Cloudflare's own convention is that it lives in committed config, and it is
# useless without an API token.
[[d1_databases]]
binding = "DB"
database_name = "jarvis"
database_id = "1dc3695c-1f4b-4e17-980e-b6f90122d35f"

# Phase 3 — identity. NOT a secret: the project id is public, it only names which
# Firebase project's tokens we accept (it sets the required `aud`, and the `iss`
# `https://securetoken.google.com/<id>`). Leaving it unset keeps the Worker on the
# pre-Phase-3 stubbed-uid path, so this config is safe to deploy as-is. To turn
# verification ON, uncomment and set it to your Firebase project id, then deploy:
#   the Worker then REQUIRES a signed `Authorization: Bearer <Firebase ID token>`
#   and ignores the old `X-Uid` header entirely.
[vars]
FIREBASE_PROJECT_ID = "jarvis-os-4efe3"

# Owner override — the owner's own account is always `pro` (2M tokens/day), no
# subscription needed, so development and on-device testing aren't stopped by the
# free daily cap. Matched by EMAIL (primary — the person's gmail is stable across
# the anonymous↔Google uid changes that account linking causes) and/or uid. NOT a
# secret and NOT a credential: it only grants pro to whoever can already sign in as
# that account (they need a signed Firebase token carrying that email/uid), so
# listing it here gives nobody else anything. Comma-separated; empty means none.
PRO_EMAILS = "goforpranjal@gmail.com"
PRO_UIDS = "GHqijQCTduNHNFR9roqWF82v60v2"

# Two-tier prompt — token saving. "off" (this value, and anything that isn't "on")
# sends the full ~1,900-token agent prompt on EVERY turn, exactly as before. "on"
# serves a plain chat turn from a slim ~250-token prompt and only pays for the full
# prompt when a turn needs a device action: a clearly-actiony message goes straight
# to the full prompt, and any slim answer that shows a sign of needing to act is
# re-run on it — so an errand is never answered without the tools. Ships "off"; flip
# to "on" and deploy ONLY after the eval confirms markers still fire, and flip back
# to "off" to revert instantly.
CONVO_TIER = "off"

# Logs, so a failing deploy can be diagnosed from the dashboard rather than guessed at.
[observability]
enabled = true
